<single-spa-router>

    <application name="@omp/platform"></application>
  </route>
  <route path="/heatmap">
    <application name="@omp/sv-mobile/markets"></application>
  </route>
  <route path="/marketx">
    <application name="@omp/sv-mobile/markets"></application>
  </route>
  <route path="/home">
    <application name="@omp/sv-mobile/home"></application>
  </route>
  <route path="/wallet/deposit">

  </route>
  <route path="/trade/:base/:quote">

  </route>
</single-spa-router>
